applications:
  - name: sap-mcp-server
    memory: 256M
    buildpacks:
      - nodejs_buildpack
    command: npm start
    routes:
      - route: sap-mcp-sj.cfapps.us10-001.hana.ondemand.com
    health-check-type: http
    health-check-http-endpoint: /health
    services:
      - mcp-destination
    env:
      NODE_ENV: production
      DATA_SOURCE: s4
      S4_DESTINATION: S4HANA_SANDBOX